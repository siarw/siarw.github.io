<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KaTeX rendering test</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css"
    integrity="sha384-WwGtaC6ywCHxA5cstpj/3+xIZvTez8dq2IcBQaXRkenHZ7FVVq1ZROtURwfbtTlG"
    crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.js"
    integrity="sha384-a1WQdjRj162i159OYq041X6I4K8NenkrI09LlPmiHg0YOb7CR+wJOraXwK9abpnE"
    crossorigin="anonymous"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      katex.render(String.raw`c = \pm\sqrt{a^2 + b^2}`, document.getElementById("mykatex1"), {
        throwOnError: false
      });
      katex.render(String.raw`f(a,b,c) = (a^2+b^2+c^2)^3`, document.getElementById("mykatex2"), {
        throwOnError: false
      });
    });
  </script>
</head>
<body>
  <main>
    <h1>KaTeX rendering test</h1>
    <p>Rendered with KaTeX's JavaScript API:</p>
    <p id="mykatex1"></p>
    <p id="mykatex2"></p>
  </main>
</body>
</html>
